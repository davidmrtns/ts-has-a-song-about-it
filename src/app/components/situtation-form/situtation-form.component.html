<form [formGroup]="situationForm" (ngSubmit)="onSubmit()" class="ts-form">
  <div class="ts-form-group">
    <label for="situation" class="ts-label">
      What's your situation?
      <span class="ts-label-hint">be honest, she already wrote about it</span>
    </label>
    <textarea
      id="situation"
      formControlName="situation"
      class="ts-textarea"
      placeholder="e.g. I drove past my ex's street at midnight just to see if the lights were on..."
      rows="4"
    ></textarea>
    @if (situation?.invalid && situation?.touched) {
      <div class="ts-error">
        <span class="ts-error-icon">✦</span>
        @if (situation?.errors?.['required']) {
          Let's get started — fill out that blank space.
        } @else {
          Don't be shy — spill the tea.
        }
      </div>
    }
  </div>
  <button type="submit" class="ts-btn">
    <span class="ts-btn-text">Find My Song</span>
    <span class="ts-btn-icon">♪</span>
  </button>
</form>
