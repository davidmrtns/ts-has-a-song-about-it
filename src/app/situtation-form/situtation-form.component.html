<form [formGroup]="situationForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="situation">Situation</label>
    <textarea id="situation" formControlName="situation" class="form-control"></textarea>
    @if (situation?.invalid && situation?.touched) {
      <div class="text-danger">Situation is required.</div>
    }
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>

<div>
  <h2>Match Result</h2>
  @if (matchResult) {
    <p><strong>Song:</strong> {{ matchResult.song.title }}</p>
    <p><strong>Quote:</strong> {{ matchResult.quote }}</p>
  } @else {
    <p>No match found.</p>
  }
</div>
